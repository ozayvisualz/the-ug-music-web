services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ugmusic-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ugmusic-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: ugmusic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ugmusic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ugmusic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/backup.sh:/backup.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugmusic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ugmusic-net

  redis:
    image: redis:7-alpine
    container_name: ugmusic-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ugmusic-net

  minio:
    image: minio/minio:latest
    container_name: ugmusic-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-ugmusic_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-changeme}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - ugmusic-net

  nginx:
    image: nginx:alpine
    container_name: ugmusic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - ugmusic-net

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ugmusic-worker
    restart: unless-stopped
    command: ["node", "scripts/worker.js"]
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ugmusic-net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  ugmusic-net:
    driver: bridge
